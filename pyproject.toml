[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signalroom"
version = "0.1.0"
description = "Two-tier LLM incident-response agent: alert to root cause, fast."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
    "drain3>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signalroom-eval = "signalroom.evals.runner:main"

[tool.setuptools.packages.find]
include = ["signalroom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
